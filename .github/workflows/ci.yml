name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rax
          POSTGRES_PASSWORD: rax
          POSTGRES_DB: rax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAX_TEST_POSTGRES_URL: postgres://rax:rax@localhost:5432/rax_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: shellcheck hack/local/*.sh
      # AX's buf format and lint, over the protos copied from AX (buf.yaml).
      - run: npx --yes @bufbuild/buf@1.75.0 format --diff --exit-code --path proto/pkg/apis
      - run: npx --yes @bufbuild/buf@1.75.0 lint --path proto/pkg/apis
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  drawing:
    # The README drawing (drawings/, pure Nix): its tests pass, the committed files are its
    # output, and the Nix is formatted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-update-lock-file --print-build-logs
      - run: nix run nixpkgs#nixpkgs-fmt -- --check flake.nix drawings/*.nix
