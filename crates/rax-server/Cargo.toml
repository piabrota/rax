[package]
name = "rax-server"
description = "The RAX control plane: the AX gRPC API over a resource store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rax-server"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
axum = { workspace = true, features = ["http2"] }
clap.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pbjson-types.workspace = true
rax-api.workspace = true
rax-otelenv.workspace = true
rax-store.workspace = true
rax-substrate.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
opentelemetry-semantic-conventions.workspace = true
prometheus.workspace = true

[dev-dependencies]
rax-substrate = { workspace = true, features = ["testing"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"] }
tokio-stream.workspace = true
