[package]
name = "rax-cli"
description = "The rax command line: apply, inspect and run commands in RAX tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rax"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true, features = ["clock"] }
libc.workspace = true
pbjson-types.workspace = true
rand.workspace = true
rax-api.workspace = true
rax-guest.workspace = true
rcgen.workspace = true
regex.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tonic.workspace = true
x509-parser.workspace = true

[dev-dependencies]
axum.workspace = true
rax-server.workspace = true
rax-store.workspace = true
rax-substrate = { workspace = true, features = ["testing"] }
rax-task-runner.workspace = true
tempfile.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
