# AX's buf configuration for the protos RAX copies from AX unchanged. buf only
# formats and lints them here; RAX generates its code with protox and prost
# (crates/rax-api/build.rs), so there is no buf.gen.yaml.
version: v2
modules:
  - path: proto # imports are relative to AX's repository root, which proto/ mirrors
    includes:
      - proto/pkg/apis
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH # package ax.v1alpha1 is in pkg/apis/v1alpha1
    - SERVICE_SUFFIX # the service is named AX
    - RPC_RESPONSE_STANDARD_NAME # standard methods return the resource itself
    - RPC_REQUEST_RESPONSE_UNIQUE # same
