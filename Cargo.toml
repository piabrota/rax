[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MPL-2.0 AND Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
pbjson = "0.9"
pbjson-types = "0.9"
pbjson-build = "0.9"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protox = "0.10"
regex = "1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
thiserror = "2"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std"] }
prost-reflect = "0.16"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
hex = "0.4"
rand = "0.9"
rax-api = { path = "crates/rax-api" }
rax-store = { path = "crates/rax-store" }
rax-server = { path = "crates/rax-server" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rax-substrate = { path = "crates/rax-substrate" }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
sha2 = "0.10"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
webpki-roots = "1"
libc = "0.2"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tonic-reflection = "0.14"
rax-guest = { path = "crates/rax-guest" }
rax-task-runner = { path = "crates/rax-task-runner" }
x509-parser = { version = "0.16", default-features = false }
